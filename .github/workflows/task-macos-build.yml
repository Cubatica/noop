name: Isolated macOS BLE validation build
on:
  push:
    branches: [fm/noop-whoop-reconnect]
permissions:
  contents: read
jobs:
  macos:
    if: github.repository == 'Cubatica/noop'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build reference app
        run: >-
          xcodebuild -scheme Strand -configuration Release
          -destination 'generic/platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO
          -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY="" build
      - name: Test reconnect policies
        run: >-
          xcodebuild -scheme Strand -configuration Debug
          -destination 'platform=macOS' -derivedDataPath build/tests
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          -only-testing:StrandTests/BondLoopHardeningTests
          -only-testing:StrandTests/BLEManagerReconnectPolicyTests
          -only-testing:StrandTests/BondRefusalGiveUpTests
          -only-testing:StrandTests/PostBondTimeoutLoopDetectorTests test
      - name: Package ad-hoc signed app
        run: |
          APP="build/dd/Build/Products/Release/NOOP Staging.app"
          test -d "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" NOOP-macos-validation.zip
          shasum -a 256 NOOP-macos-validation.zip > SHA256SUMS
          git rev-parse HEAD > SOURCE_COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: noop-macos-validation
          path: |
            NOOP-macos-validation.zip
            SHA256SUMS
            SOURCE_COMMIT
          retention-days: 7
